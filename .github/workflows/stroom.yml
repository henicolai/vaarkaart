name: Stroommetingen ophalen
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/stroom.py', '.github/workflows/stroom.yml']
permissions:
  contents: write
concurrency:
  group: stroom
  cancel-in-progress: true
jobs:
  stroom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stroom.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stroom.json
          git diff --cached --quiet || git commit -m "Stroommetingen bijgewerkt"
          git pull --rebase origin main
          git push

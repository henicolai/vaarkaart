name: Stremmingen ophalen
on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/stremmingen.py', '.github/workflows/stremmingen.yml']
permissions:
  contents: write
concurrency:
  group: stremmingen
  cancel-in-progress: true
jobs:
  stremmingen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/stremmingen.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stremmingen.json
          git diff --cached --quiet || git commit -m "Stremmingen bijgewerkt"
          git pull --rebase origin main
          git push

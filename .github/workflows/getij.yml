name: Getijden ophalen
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/getij.py', '.github/workflows/getij.yml']
permissions:
  contents: write
jobs:
  getij:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/getij.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/getij.json
          git diff --cached --quiet || git commit -m "Getijden bijgewerkt"
          git pull --rebase origin main
          git push

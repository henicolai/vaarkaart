name: Boeinamen ophalen
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/boeinamen.py', '.github/workflows/boeinamen.yml']
permissions:
  contents: write
jobs:
  boeinamen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/boeinamen.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boeinamen.json
          git diff --cached --quiet || git commit -m "Boeinamen bijgewerkt"
          git pull --rebase origin main
          git push
